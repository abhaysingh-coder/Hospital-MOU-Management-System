<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Information Saved</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
        }

        .success-box {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 50px 35px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1769aa;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 30px;
            background: #1769aa;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0d4f82;
        }

    </style>

</head>

<body>

    <div class="success-box">

        <div class="success-icon">
            ✅
        </div>

        <h1>Information Saved Successfully!</h1>

        <p>
            Hospital and facility information has been
            successfully saved to the database.
        </p>

        <a href="{% url 'facility_information' %}" class="btn">
            Enter Another Record
        </a>

    </div>

</body>
</html>
