{% load static %}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in | Hospital MOU</title>
	<link rel="icon" type="image/png" href="{% static 'favicon.png' %}" sizes="64x64">
	<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}" sizes="any">
	<link rel="stylesheet" href="{% static 'CSS/dashboard.css' %}">
</head>
<body class="login-page">
	<section class="login-card">
		<span class="login-mark">🏥</span>
		<span class="eyebrow">Secure workspace</span>
		<h1>Hospital MOU Management</h1>
		<p>Sign in to manage facilities and agreements.</p>
		<form method="post">
			{% csrf_token %}
			{% if form.errors %}<div class="field-error">Your username or password was not recognised.</div>{% endif %}
			<div class="field">
				<label for="id_username">Username</label>
				<input id="id_username" name="username" autocomplete="username" required>
			</div>
			<div class="field">
				<label for="id_password">Password</label>
				<input id="id_password" name="password" type="password" autocomplete="current-password" required>
			</div>
			<input type="hidden" name="next" value="{{ next }}">
			<button class="button" type="submit">Sign in</button>
		</form>
	</section>
</body>
</html>
